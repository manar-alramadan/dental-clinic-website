<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>عيادة د. راما الرمضان</title>
    <link rel="preload" as="style" href="http://localhost:8080/build/assets/app-CpIiSNxj.css" /><link rel="modulepreload" href="http://localhost:8080/build/assets/app-DUr89oQr.js" /><link rel="stylesheet" href="http://localhost:8080/build/assets/app-CpIiSNxj.css" /><script type="module" src="http://localhost:8080/build/assets/app-DUr89oQr.js"></script></head>
<body class="bg-white text-gray-800 antialiased">
  
<div class="min-h-screen bg-slate-950 px-6 py-12 text-white flex items-center justify-center">


<div class="w-full max-w-md">

    
    <div class="mb-8 text-center">

        <div class=" mb-5 flex  justify-center    ">
          <span class="flex h-12 w-12 items-center justify-center rounded-full bg-white shadow-lg">
          <img  src="http://localhost:8080/images/teethlogo3.jpg"
                                        alt="د. راما محمد الرمضان"
                                          class="rounded-full  h-10 w-10 object-cover"    >

                                  </span>
        </div>

        <span class="font-bold text-cyan-300">
            Dr.Rama Mohammad Alramadan
        </span>

        <h1 class="mt-2 text-3xl font-black">
            تسجيل الدخول
        </h1>

        <p class="mt-3 text-slate-400">
            سجّل الدخول للوصول إلى لوحة التحكم.
        </p>

    </div>


    
    

    
    <form
        method="POST"
        action="http://localhost:8080/admin/login"
        class="space-y-6 rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl backdrop-blur-xl md:p-8"
    >

        <input type="hidden" name="_token" value="sqWAv2yxvXM5cLv5CdJ1aTkbQflxPgNLcVLWJ8Tu" autocomplete="off">

        
        <div>

            <label
                for="email"
                class="mb-3 block text-sm font-bold text-slate-200"
            >
                البريد الإلكتروني
            </label>

            <input
                id="email"
                name="email"
                type="email"
                value=""
                required
                autofocus
                autocomplete="email"
                placeholder="example@gmail.com"
                class="w-full rounded-2xl border border-white/10 bg-slate-900 px-5 py-4 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400"
            >

        </div>


        
        <div>

            <label
                for="password"
                class="mb-3 block text-sm font-bold text-slate-200"
            >
                كلمة المرور
            </label>

            <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full rounded-2xl border border-white/10 bg-slate-900 px-5 py-4 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400"
            >

        </div>


        
        <button
            type="submit"
            class="w-full rounded-2xl bg-cyan-500 px-6 py-4 font-black text-white transition hover:bg-cyan-400"
        >
            تسجيل الدخول
        </button>

    </form>


    
    <div class="mt-6 text-center">

        <a
            href="http://localhost:8080"
            class="text-sm font-bold text-slate-400 transition hover:text-cyan-300"
        >
            ← العودة إلى الموقع
        </a>

    </div>

</div>


</div>

</body>
</html>
