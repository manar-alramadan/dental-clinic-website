services:

    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: dental-clinic-app

        restart: unless-stopped

        ports:
            - "8080:80"

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            CLOUDINARY_URL: ${CLOUDINARY_URL}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: dental_clinic
            DB_USERNAME: dental_user
            DB_PASSWORD: dental_password

        depends_on:
            mysql:
                condition: service_healthy

        volumes:
            - .:/var/www


    mysql:
        image: mysql:8.0

        container_name: dental-clinic-mysql

        restart: unless-stopped

        environment:
            MYSQL_DATABASE: dental_clinic
            MYSQL_USER: dental_user
            MYSQL_PASSWORD: dental_password
            MYSQL_ROOT_PASSWORD: root_password

        ports:
            - "3307:3306"

        volumes:
            - dental_mysql_data:/var/lib/mysql

        healthcheck:
            test:
              [
                  "CMD",
                  "mysqladmin",
                  "ping",
                  "-h",
                  "localhost",
                  "-u",
                  "root",
                  "-proot_password"
              ]
            interval: 5s
            timeout: 5s
            retries: 20


volumes:
    dental_mysql_data:
